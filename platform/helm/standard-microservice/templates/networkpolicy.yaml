{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "standard-microservice.fullname" . }}
  labels:
    {{- include "standard-microservice.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "standard-microservice.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  {{- with .Values.networkPolicy.ingress.from }}
  ingress:
    - from:
        {{- toYaml . | nindent 8 }}
  {{- end }}
  {{- with .Values.networkPolicy.egress.to }}
  egress:
    - to:
        {{- toYaml . | nindent 8 }}
  {{- end }}
{{- end }}
