image: alpine/helm:3.17.3

pipelines:
  pull-requests:
    '**':
      - step:
          name: Lint and render Helm chart
          script:
            - set -eu
            - for env in dev staging production; do
                for svc in users orders payments notifications; do
                  helm lint platform/helm/standard-microservice -f deploy/$env/$svc.yaml;
                  helm template $svc platform/helm/standard-microservice -n $svc-$env -f deploy/$env/$svc.yaml >/dev/null;
                done;
              done

  branches:
    main:
      - step:
          name: Validate chart
          script:
            - helm lint platform/helm/standard-microservice
            - helm template users platform/helm/standard-microservice -n users-dev -f deploy/dev/users.yaml

