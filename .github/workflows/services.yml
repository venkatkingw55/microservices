name: Service tests and images

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  unittest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Run unit tests
        run: python -m unittest discover -s services -t . -p 'test_*.py'
  images:
    needs: unittest
    runs-on: ubuntu-latest
    env:
      IMAGE: ${{ secrets.DOCKER_USERNAME }}/${{ matrix.service }}
    strategy:
      fail-fast: false
      matrix:
        service: [users, orders, payments, notifications]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build image
        run: docker build -f "services/${{ matrix.service }}/Dockerfile" -t "${{ matrix.service }}:${{ github.sha }}" .

      - name: Login to Docker Hub
        if: github.event_name == 'push'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASS }}

      - name: Push image
        if: github.event_name == 'push'
        run: |
          docker tag "${{ matrix.service }}:${{ github.sha }}" "${IMAGE}:${{ github.sha }}"
          docker push "${IMAGE}:${{ github.sha }}"
